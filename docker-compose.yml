services:
  backend:
    ports: ["8000:8000"]
    build: ./backend
    container_name: backend
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    ports: ["8080:80"]
    container_name: frontend
    image: nginx:alpine
    volumes:
      - type: bind
        source: ./frontend
        target: /usr/share/nginx/html
        read_only: true
    depends_on:
      backend:
        condition: service_healthy
  
  database:
    container_name: database
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports: ["3306:3306"]
    volumes:
      - ./baza.sql:/docker-entrypoint-initdb.d/baza.sql
    healthcheck:
      test: mysql --user=root --password=${DB_PASSWORD} --execute="SHOW DATABASES;"
      interval: 5s
      timeout: 3s
      retries: 5