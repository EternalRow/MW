services:
  backend:
    ports: ["8000:8000"]
    build: ./backend
    container_name: backend

  frontend:
    ports: ["8080:80"]
    container_name: frontend
    image: nginx:alpine
    volumes:
      - type: bind
        source: ./frontend
        target: /usr/share/nginx/html
        read_only: true
  
  database:
    container_name: database
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    ports: ["3306:3306"]
    volumes:
      - ./baza.sql:/docker-entrypoint-initdb.d/baza.sql