services:
  backend:
    build: ./backend
    container_name: backend
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      backend:
        condition: service_healthy
  
  database:
    container_name: database
    image: mysql:9.7.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - dbdata:/var/lib/mysql
      - ./baza.sql:/docker-entrypoint-initdb.d/baza.sql
    healthcheck:
      test: mysql --user=root --password=${DB_PASSWORD} --execute="SHOW DATABASES;"
      interval: 5s
      timeout: 3s
      retries: 5

  
volumes:
  dbdata: